# Publish to PyPI on a version tag, via Trusted Publishing.
#
# No API token is stored in this repo or in GitHub secrets: PyPI verifies the
# short-lived OIDC token GitHub mints for this exact (repo, workflow,
# environment) triple. That is why the publish job needs `id-token: write` and
# why it must stay a SEPARATE job — the build job runs project code and should
# never hold a credential-minting permission.
#
# One-time setup on PyPI before the first tag (pypi.org -> Your projects ->
# Publishing, or "pending publisher" while the name is unclaimed):
#   Owner: baggybin   Repository: salient-core
#   Workflow: release.yml   Environment: pypi
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      # --strict fails on a README that PyPI can't render. Catching that here
      # matters because a version number cannot be reused: a broken description
      # is only fixable by burning the version and cutting a new one.
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
